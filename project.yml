name: Cove
options:
  bundleIdPrefix: com.biboyang
  createIntermediateGroups: true

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    from: 6.0.0
  TraceKit:
    path: Frameworks/TraceKit
  KeychainKit:
    path: Frameworks/KeychainKit
  SourceKit:
    path: Frameworks/SourceKit
  ImagePipeline:
    path: Frameworks/ImagePipeline
  CacheKit:
    path: Frameworks/CacheKit
  PreheatKit:
    path: Frameworks/PreheatKit
  ComicKit:
    path: Frameworks/ComicKit
  ReaderKit:
    path: Frameworks/ReaderKit

targets:
  Cove:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Cove
        excludes:
          - Resources/Info.plist
          - Resources/Cove.entitlements
    dependencies:
      - package: SnapKit
        product: SnapKit
      - package: TraceKit
        product: TraceKit
      - package: KeychainKit
        product: KeychainKit
      - package: SourceKit
        product: SourceKit
      - package: ImagePipeline
        product: ImagePipeline
      - package: CacheKit
        product: CacheKit
      - package: PreheatKit
        product: PreheatKit
      - package: ComicKit
        product: ComicKit
      - package: ReaderKit
        product: ReaderKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.biboyang.cove
        PRODUCT_NAME: Cove
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Cove/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cove/Resources/Cove.entitlements
        CODE_SIGN_STYLE: Automatic
        # TODO: set your own Apple Developer Team ID here before App Store
        # distribution / notarization. Empty team + Automatic signing means
        # "Sign to Run Locally" (ad hoc), which is fine for development only.
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
  CoveTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/CoveTests
    dependencies:
      - target: Cove
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.biboyang.cove.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Cove:
    build:
      targets:
        Cove: all
        CoveTests: [test]
    test:
      targets:
        - CoveTests
